site_name: The Py Lama Notes


theme:
  name: material

  palette:
    scheme: slate
    primary: black

  logo: imgs/logo.png
  favicon: imgs/logo.png

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.follow
    - content.code.annotate

  

nav:
  - Home: index.md

  - Data Structures:
      - Arrays: data structures/arrays/arrays.md
      - Hashing: data structures/hashing/hashing.md
      - Queue: data structures/queue.md
      - Stack: data structures/stack.md
      - Sliding Window: data structures/arrays/sliding-window.md
      - Two Pointers: data structures/arrays/two-pointers.md

  - Algorithms:
      - Binary Search: algorithms/binarysearch.md
      - Bubble Sort: algorithms/sorting/bubblesort.md
      - Merge Sort: algorithms/sorting/mergesort.md
      - Insertion Sort: algorithms/sorting/insertionsort.md
      - Quick Sort: algorithms/sorting/quicksort.md


plugins:
  - search

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

  - pymdownx.tabbed:
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js